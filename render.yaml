services:
  - type: web
    name: universityhub-api
    runtime: python
    plan: free
    rootDir: Django/UniversityHub
    buildCommand: "bash build.sh"
    startCommand: "gunicorn UniversityHub.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /academic/hello/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      # Set this in the Render dashboard to your Neon connection string:
      # postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Set this in the Render dashboard to your Vercel URL, e.g.
      # https://university-web.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
